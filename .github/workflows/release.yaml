# Commands to push updates:
# Open the terminal in VSCode.
# Run these two commands:
# git tag v1.0.X
# git push origin v1.0.X
# Increment X for new releases.

name: Package and Release Addon

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so tag versions register

      - name: Run BigWigs Packager
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -c 1686104 -n "RoleplayEventParser {project-version}" -p "RoleplayEventParser {project-version}" -r release