# Commands to push updates:
# Open the terminal in VSCode.
# Run these two commands:
# git tag v1.0.X
# git push origin v1.0.X
# Increment X for new releases.

name: Package and Release Addon

on:
  push:
    tags:
      - '**' # Triggers on any tag push

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Step A: Checkout full git tag history
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step B: Run BigWigs Packager with valid flag arguments
      - name: Run BigWigs Packager
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # -c <CurseForge_Project_ID>
          # -r release (forces Release status)
          # -n "{file_template}:{label_template}"
          args: -c 1686104 -r release -n "RoleplayEventParser-{project-version}:RoleplayEventParser {project-version}"